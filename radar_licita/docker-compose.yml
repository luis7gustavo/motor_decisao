services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: radar_licita
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar_licita"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://radar:radar@db:5432/radar_licita
      DOCUMENT_STORAGE_PATH: /app/data/documents
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - document_data:/app/data/documents
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  document_data:

