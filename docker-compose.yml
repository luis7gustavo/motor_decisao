name: motor_decisao

x-prefect-server-environment: &prefect-server-environment
  PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${PREFECT_POSTGRES_USER:-prefect}:${PREFECT_POSTGRES_PASSWORD:-prefect}@prefect-postgres:5432/${PREFECT_POSTGRES_DB:-prefect}
  PREFECT_MESSAGING_BROKER: prefect_redis.messaging
  PREFECT_MESSAGING_CACHE: prefect_redis.messaging
  PREFECT_REDIS_MESSAGING_URL: redis://redis:6379/1
  PREFECT_SERVER_DOCKET_URL: redis://redis:6379/1

x-collection-worker-environment: &collection-worker-environment
  PREFECT_API_URL: http://prefect-server:4200/api
  DATABASE_URL: postgresql+psycopg://${MOTOR_POSTGRES_USER:-motor}:${MOTOR_POSTGRES_PASSWORD:-motor}@postgres:5432/${MOTOR_POSTGRES_DB:-motor_decisao}
  REDIS_URL: redis://redis:6379/0
  MOTOR_CONFIG_PATH: /app/config/config.yaml
  SILLO_SOURCE_REGISTRY_PATH: /app/config/sources
  SILLO_MAX_PRODUCT_PRICE_BRL: ${SILLO_MAX_PRODUCT_PRICE_BRL:-3000.00}

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: motor_postgres
    environment:
      POSTGRES_USER: ${MOTOR_POSTGRES_USER:-motor}
      POSTGRES_PASSWORD: ${MOTOR_POSTGRES_PASSWORD:-motor}
      POSTGRES_DB: ${MOTOR_POSTGRES_DB:-motor_decisao}
    ports:
      - "${MOTOR_POSTGRES_PORT:-55432}:5432"
    volumes:
      - motor_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MOTOR_POSTGRES_USER:-motor} -d ${MOTOR_POSTGRES_DB:-motor_decisao}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: motor_redis
    ports:
      - "${MOTOR_REDIS_PORT:-6380}:6379"
    volumes:
      - motor_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  selenium:
    image: selenium/standalone-chrome:4.43.0-20260404
    container_name: motor_selenium
    shm_size: "2gb"
    ports:
      - "${SELENIUM_PORT:-4444}:4444"
      - "${SELENIUM_NOVNC_PORT:-7900}:7900"
    environment:
      # 2026-05-02: keep Selenium capacity aligned with the scraper fan-out.
      SE_NODE_MAX_SESSIONS: ${SELENIUM_MAX_SESSIONS:-4}
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
      SE_SESSION_REQUEST_TIMEOUT: "60"
      SE_SESSION_RETRY_INTERVAL: "5"
      SE_SCREEN_WIDTH: "1366"
      SE_SCREEN_HEIGHT: "768"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/status"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: motor_api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${MOTOR_POSTGRES_USER:-motor}:${MOTOR_POSTGRES_PASSWORD:-motor}@postgres:5432/${MOTOR_POSTGRES_DB:-motor_decisao}
      REDIS_URL: redis://redis:6379/0
      MOTOR_CONFIG_PATH: /app/config/config.yaml
      SELENIUM_REMOTE_URL: http://selenium:4444/wd/hub
    ports:
      - "${MOTOR_API_PORT:-8010}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      selenium:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  daemon:
    profiles:
      - daemon
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${MOTOR_POSTGRES_USER:-motor}:${MOTOR_POSTGRES_PASSWORD:-motor}@postgres:5432/${MOTOR_POSTGRES_DB:-motor_decisao}
      REDIS_URL: redis://redis:6379/0
      MOTOR_CONFIG_PATH: /app/config/config.yaml
      SELENIUM_REMOTE_URL: http://selenium:4444/wd/hub
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      selenium:
        condition: service_healthy
    volumes:
      - .:/app
    healthcheck:
      disable: true

  prefect-postgres:
    profiles: [control]
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${PREFECT_POSTGRES_USER:-prefect}
      POSTGRES_PASSWORD: ${PREFECT_POSTGRES_PASSWORD:-prefect}
      POSTGRES_DB: ${PREFECT_POSTGRES_DB:-prefect}
    ports:
      - "${PREFECT_POSTGRES_PORT:-55433}:5432"
    volumes:
      - prefect_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PREFECT_POSTGRES_USER:-prefect} -d ${PREFECT_POSTGRES_DB:-prefect}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  prefect-server:
    profiles: [control]
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: motor_decisao-api
    environment:
      <<: *prefect-server-environment
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_SERVER_UI_API_URL: http://${SILLO_PREFECT_HOST:-127.0.0.1}:${PREFECT_SERVER_PORT:-4200}/api
    command: prefect server start --host 0.0.0.0 --port 4200 --no-services
    ports:
      - "${PREFECT_SERVER_PORT:-4200}:4200"
    depends_on:
      prefect-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4200/api/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  prefect-services:
    profiles: [control]
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: motor_decisao-api
    environment:
      <<: *prefect-server-environment
      PREFECT_API_URL: http://prefect-server:4200/api
    command: prefect server services start
    depends_on:
      prefect-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped

  prefect-init:
    profiles: [control]
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: motor_decisao-api
    environment:
      <<: *collection-worker-environment
      SILLO_ENABLE_SCHEDULES: ${SILLO_ENABLE_SCHEDULES:-false}
    command: python scripts/init_prefect.py
    depends_on:
      prefect-server:
        condition: service_healthy
    volumes:
      - .:/app
    restart: "no"

  worker-http-pc1:
    profiles: [control]
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: motor_decisao-api
    env_file: [.env]
    environment:
      <<: *collection-worker-environment
      SILLO_WORKER_ID: pc1-http
    command: prefect worker start --pool sillo-collection --work-queue api-http --name pc1-http --limit ${SILLO_PC1_HTTP_FLOW_LIMIT:-3}
    depends_on:
      prefect-init:
        condition: service_completed_successfully
    volumes:
      - .:/app
    restart: unless-stopped

  worker-browser-pc1:
    profiles: [control]
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: motor_decisao-api
    env_file: [.env]
    environment:
      <<: *collection-worker-environment
      SILLO_WORKER_ID: pc1-browser
    command: prefect worker start --pool sillo-collection --work-queue browser --name pc1-browser --limit ${SILLO_PC1_BROWSER_FLOW_LIMIT:-1}
    depends_on:
      prefect-init:
        condition: service_completed_successfully
    volumes:
      - .:/app
    restart: unless-stopped

  worker-manual-pc1:
    profiles: [control]
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: motor_decisao-api
    env_file: [.env]
    environment:
      <<: *collection-worker-environment
      SILLO_WORKER_ID: pc1-manual
    command: prefect worker start --pool sillo-collection --work-queue manual --name pc1-manual --limit 1
    depends_on:
      prefect-init:
        condition: service_completed_successfully
    volumes:
      - .:/app
    restart: unless-stopped

volumes:
  motor_postgres_data:
    name: motor_postgres_data
  motor_redis_data:
    name: motor_redis_data
  prefect_postgres_data:
    name: prefect_postgres_data
