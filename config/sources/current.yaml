  - source_id: mirao
    display_name: Mirao
    enabled: true
    source_type: supplier
    market_scope: regional_b2b
    collector: mirao
    strategy: parsel
    access: PUBLIC_HTTP
    priority: 70
    profiles: [suppliers, local, full]
    urls:
      - https://www.mirao.com.br/perifericos.html
      - https://www.mirao.com.br/hardware.html
      - https://www.mirao.com.br/cabos.html
    retry: {max_retries: 3, backoff_base_seconds: 1, backoff_max_seconds: 30, jitter_seconds: 0.5}
    timeouts: {request_seconds: 30, handler_seconds: 90, collection_seconds: 1800}
    concurrency: {desired_concurrency: 3, max_concurrency: 5, max_tasks_per_minute: 30}
    scheduling: {enabled: true, interval_hours: 8, minute_offset: 50, timezone: America/Sao_Paulo}
    config:
      pagination: {enabled: true, url_pattern: "{url}?p={page}", max_pages: 60, start_page: 2}
      selectors: {product: ".product-item", title: "strong", price: "span + span", product_url: "a@href"}

  - source_id: shopee
