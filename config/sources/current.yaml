  # Fase 9: fontes publicas verificadas e adapters declarativos.
  - source_id: grupo_tek
    display_name: Grupo TEK Distribuidor
    enabled: true
    source_type: supplier
    market_scope: regional_b2b
    collector: grupo_tek
    strategy: parsel
    access: PUBLIC_HTTP
    priority: 72
    profiles: [suppliers, full]
    urls: [https://www.tekdistribuidor.com.br/]
    retry: {max_retries: 3, backoff_base_seconds: 1, backoff_max_seconds: 30, jitter_seconds: 0.5}
    timeouts: {request_seconds: 30, handler_seconds: 90, collection_seconds: 900}
    concurrency: {desired_concurrency: 2, max_concurrency: 4, max_tasks_per_minute: 30}
    scheduling: {enabled: true, interval_hours: 8, minute_offset: 25, timezone: America/Sao_Paulo}
    config:
      selectors: {product: "a.product-info", title: ".product-name", price: ".current-price", product_url: "@href"}

  - source_id: cia_informatica
    display_name: Cia da Informatica
    enabled: true
    source_type: market
    market_scope: local_retailer
    collector: catalog_market
    strategy: parsel
    access: PUBLIC_HTTP
    priority: 73
    profiles: [market, local, full]
    urls: [https://www.ciainfor.com.br/loja/]
    retry: {max_retries: 3, backoff_base_seconds: 1, backoff_max_seconds: 30, jitter_seconds: 0.5}
    timeouts: {request_seconds: 30, handler_seconds: 90, collection_seconds: 900}
    concurrency: {desired_concurrency: 2, max_concurrency: 4, max_tasks_per_minute: 30}
    scheduling: {enabled: true, interval_hours: 12, minute_offset: 15, timezone: America/Sao_Paulo}
    config:
      catalog_mode: true
      selectors: {product: "ul.products li.product", title: ".woocommerce-loop-product__title", price: ".price", product_url: "a.woocommerce-LoopProduct-link@href"}

  # Acesso publico observado, mas ativacao depende de canary local bem-sucedido.
  - source_id: fcinfo
    display_name: FCInfo Computadores
    enabled: false
