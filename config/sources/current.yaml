    timeouts: {request_seconds: 45, handler_seconds: 120, collection_seconds: 1800}
    concurrency: {desired_concurrency: 1, max_concurrency: 2, max_tasks_per_minute: 30}
    browser: {enabled: true, headless: true, block_images: true, block_fonts: true, block_media: true, block_tracking: true}
