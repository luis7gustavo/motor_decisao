    strategy: parsel
    access: PUBLIC_HTTP
    priority: 74
    profiles: [market, local, full]
    urls: [https://www.fcinfo.com.br/]
    scheduling: {enabled: false}
    config:
      catalog_mode: true
      selectors: {product: ".product-layout, .product-item", title: ".name, .product-name", price: ".price", product_url: "a@href"}

  - source_id: netshop_informatica
    display_name: Netshop Informatica
    enabled: false
    source_type: market
    market_scope: local_retailer
    collector: catalog_market
    strategy: adaptive_playwright
    access: PUBLIC_BROWSER
    priority: 75
    profiles: [market, local, full]
    urls: [https://www.netshopinformatica.com.br/produtos]
    browser: {enabled: true, headless: true, block_images: true, block_fonts: true, block_media: true, block_tracking: true}
    scheduling: {enabled: false}
    config:
      catalog_mode: true
      selectors: {product: "[class*='product-card'], [class*='produto']", title: "h2, h3, [class*='title']", price: "[class*='price'], [class*='preco']", product_url: "a@href"}

