sources:
  - source_id: mercado_livre
    display_name: Mercado Livre
    enabled: false
    source_type: market
    market_scope: marketplace
    collector: mercado_livre
    strategy: api
    access: PUBLIC_API
    priority: 10
    profiles: [market, full]
    urls: [https://api.mercadolibre.com]
    retry: {max_retries: 3, backoff_base_seconds: 1, backoff_max_seconds: 30, jitter_seconds: 0.5}
    timeouts: {request_seconds: 20, handler_seconds: 90, collection_seconds: 1800}
    concurrency: {desired_concurrency: 4, max_concurrency: 8, max_tasks_per_minute: 120}
    scheduling: {enabled: true, interval_hours: 2, minute_offset: 0, timezone: America/Sao_Paulo}
    config:
      query_group: technology
      disabled_reason: "Token expirado; reativar somente apos configurar ML_CLIENT_ID, ML_CLIENT_SECRET e renovar ML_ACCESS_TOKEN/ML_REFRESH_TOKEN."

  - source_id: amazon
    display_name: Amazon Brasil
    enabled: true
    source_type: market
    market_scope: marketplace
    collector: amazon
    strategy: adaptive_playwright
    access: PUBLIC_BROWSER
    priority: 20
    profiles: [market, full]
    urls: [https://www.amazon.com.br]
    retry: {max_retries: 3, backoff_base_seconds: 2, backoff_max_seconds: 60, jitter_seconds: 1}
    timeouts: {request_seconds: 45, handler_seconds: 120, collection_seconds: 1800}
    concurrency: {desired_concurrency: 1, max_concurrency: 2, max_tasks_per_minute: 30}
    browser: {enabled: true, headless: true, block_images: true, block_fonts: true, block_media: true, block_tracking: true}
    scheduling: {enabled: true, interval_hours: 4, minute_offset: 5, timezone: America/Sao_Paulo}
    config: {query_group: technology}

  - source_id: kabum
    display_name: KaBuM!
